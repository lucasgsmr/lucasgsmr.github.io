<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F6F4F0">
<meta name="format-detection" content="telephone=no">
<title>Treino</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171A1F'/%3E%3Cpath d='M14 26v12M20 21v22M44 21v22M50 26v12M20 32h24' stroke='%23F6F4F0' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F4F0; --card:#FFF; --soft:#EFECE6; --edge:#DEDAD2;
  --ink:#171A1F; --mid:#525B68; --dim:#6E7581;
  --sig:#B4530A; --sig-bg:#FDF3E7; --go:#15803D; --go-bg:#EDF7F0; --bad:#B91C1C; --bad-bg:#FDF0EF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  font-size:17px;line-height:1.5;padding-bottom:112px;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
input,textarea,select{font-family:inherit;color:inherit;background:none;border:0;outline:none;font-size:inherit}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hide{display:none!important}
body.trava{overflow:hidden}

header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--edge);padding:12px 16px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.crumb{font-size:13.5px;color:var(--mid);font-weight:500}
.sv{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:5px}
.sv i{width:7px;height:7px;border-radius:50%;background:var(--go);flex:0 0 auto}
.sv.warn{color:var(--bad);font-weight:700} .sv.warn i{background:var(--bad)}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em}
.focus{font-size:14.5px;color:var(--mid);margin-top:1px}
.tag{margin-top:9px;display:inline-block;font-size:13.5px;font-weight:600;padding:4px 11px;
  border-radius:20px;background:var(--sig-bg);color:var(--sig)}
.tag.dl{background:var(--bad-bg);color:var(--bad)}
.days{display:flex;gap:7px;overflow-x:auto;padding:11px 16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:9px 16px;border-radius:22px;background:var(--card);border:1px solid var(--edge);
  font-size:15.5px;font-weight:600;white-space:nowrap;color:var(--mid)}
.day small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--sig);line-height:1;margin-top:2px}
.day.next:not(.on){border-color:var(--sig);color:var(--sig)}
.day.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day.done{border-color:var(--go);color:var(--go)}
.day.on.done{background:var(--go);border-color:var(--go);color:#fff}
main{padding:2px 16px 0;max-width:620px;margin:0 auto}

.ex{background:var(--card);border:1px solid var(--edge);border-radius:12px;margin-bottom:12px;overflow:hidden}
.ex.done{border-color:var(--go)}
.exh{padding:15px 16px 12px}
.exn{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.exn small{display:block;font-size:13px;font-weight:500;color:var(--sig);margin-top:3px}
.exm{font-size:14px;color:var(--mid);margin-top:5px;font-weight:500}
.exm s{color:var(--dim)} .exm b{color:var(--sig)}
.acts{display:flex;gap:16px;margin-top:11px}
.acts button{font-size:14px;font-weight:600;color:var(--mid);padding:0}
.acts button.rm{color:var(--bad)}
.tip{margin:0 16px 12px;background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--mid)}
.subs{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.subs button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:11px 13px;text-align:left}
.subs button b{font-size:15.5px;font-weight:600}
.subs button span{font-size:13px;color:var(--dim);white-space:nowrap}
#pbox{min-height:88px;font-size:11.5px}
.sn i{font-style:normal;display:block;font-size:12px;color:var(--sig);font-weight:700;line-height:1}
.vf.over{background:var(--sig)} .vv.over{color:var(--sig)}
.acts button.act{color:var(--sig)}
.aquece{margin:0 0 12px;padding:11px 14px;border-radius:10px;background:var(--soft);font-size:14px;color:var(--mid)}
.aquece b{color:var(--ink)}
.ex.par{margin-bottom:4px;border-bottom-left-radius:4px;border-bottom-right-radius:4px}
.tip.down{background:var(--bad-bg);color:var(--bad);font-weight:500}
.rec{font-size:13.5px;color:var(--go);font-weight:600;margin-top:5px}
.tip.pes{background:var(--sig-bg);color:var(--sig);border-left:3px solid var(--sig)}
.foot{justify-content:flex-end}
.tip.up{background:var(--sig-bg);color:var(--sig);font-weight:500}
.tip b{font-weight:700}
.tip .ref{display:block;font-size:13px;margin-top:3px;opacity:.85}
.tip .ref:first-child{margin-top:0;font-size:14px}

/* concluído: vira uma linha */
.col{cursor:pointer}
.col .sum{display:flex;align-items:flex-start;gap:11px;padding:14px 16px}
.col .sum .ck{color:var(--go);font-weight:700;font-size:18px;line-height:1.3}
.col .sum .tx{flex:1}
.col .sum .tx b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.col .sum .tx span{font-size:14.5px;color:var(--mid)}

table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--dim);text-align:center;padding:0 0 6px;text-transform:uppercase}
th.l{text-align:left;padding-left:16px}
td{padding:0;border-top:1px solid var(--edge);text-align:center}
tr.ok{background:var(--go-bg)}
.sn{font-size:15px;color:var(--dim);width:34px;padding-left:16px;text-align:left;font-weight:600}
.pv{font-size:13px;color:var(--dim);width:74px;line-height:1.3}
.pv b{color:var(--mid);font-weight:600}
.in{width:82px}
.in input{width:100%;padding:14px 0;text-align:center;font-size:24px;font-weight:700;border-radius:8px;letter-spacing:-.02em}
.in input:focus{background:var(--soft);box-shadow:inset 0 0 0 2px var(--sig)}
.in input::placeholder{color:var(--dim);font-weight:500;font-size:19px}
.xx{width:38px}
.xx button{width:30px;height:30px;border-radius:8px;color:var(--dim);font-size:19px;line-height:1;visibility:hidden}
tr.tem .xx button,tr.ok .xx button{visibility:visible}
tr.ok .xx button{color:var(--bad)}
.foot{display:flex;align-items:center;gap:11px;padding:11px 16px;border-top:1px solid var(--edge)}
.foot span{font-size:14px;color:var(--mid);font-weight:500}
.foot input{width:56px;text-align:center;font-size:19px;font-weight:700;background:var(--soft);border-radius:8px;padding:7px 0}
.foot .add{margin-left:auto;font-size:14px;color:var(--mid);font-weight:600;
  border:1px solid var(--edge);border-radius:8px;padding:7px 13px}

.card{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:18px;font-weight:700;margin:0 0 5px;letter-spacing:-.01em}
.card p{font-size:14.5px;color:var(--mid);margin:0 0 13px}
.note{width:100%;background:var(--soft);border-radius:8px;padding:12px;font-size:16px;
  resize:vertical;min-height:76px;color:var(--ink);border:1px solid transparent}
.note:focus{border-color:var(--sig)}
.rd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rd span{flex:1;font-size:15.5px;font-weight:500}
.rd button{padding:9px 15px;border:1px solid var(--edge);border-radius:8px;font-size:14.5px;color:var(--mid);font-weight:600}
.rd button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rd button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.alert{background:var(--bad-bg);border-left:3px solid var(--bad);padding:12px 14px;
  border-radius:0 8px 8px 0;font-size:14.5px;margin-bottom:12px}
.alert b{color:var(--bad)}
.alert.i{background:var(--sig-bg);border-color:var(--sig)} .alert.i b{color:var(--sig)}

.vr{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.vn{flex:0 0 108px;font-size:15px;font-weight:500}
.vb{flex:1;height:9px;background:var(--soft);border-radius:5px;overflow:hidden}
.vf{height:100%;border-radius:5px;background:var(--dim);transition:width .3s}
.vf.full{background:var(--go)} .vf.pri{background:var(--sig)}
.vv{flex:0 0 56px;text-align:right;font-size:15px;color:var(--mid);font-weight:600}
.vv b{color:var(--ink);font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.fld{background:var(--soft);border-radius:8px;padding:9px 12px}
.fld label{display:block;font-size:12.5px;color:var(--mid);font-weight:600}
.fld input{width:100%;font-size:22px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--edge);
  padding:11px 0;font-size:15px;color:var(--mid)}
.row b{color:var(--ink);font-weight:700;font-size:17px}
.row b.up{color:var(--go)} .row b.dn{color:var(--bad)}
.btn{display:block;width:100%;padding:15px;background:var(--ink);color:var(--bg);border-radius:10px;
  font-weight:700;font-size:16px;text-align:center}
.btn.g{background:var(--card);border:1px solid var(--edge);color:var(--mid)}
.btn.dan{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.alert .btn{background:var(--sig);color:#fff}
.btn+.btn{margin-top:9px}
.finp{width:100%;background:var(--soft);border-radius:8px;padding:13px;font-size:16px;margin-bottom:9px}
.frow{display:flex;gap:9px} .frow .finp{flex:1;min-width:0;text-align:center}
.frow .btn+.btn{margin-top:0}
select.finp{appearance:none;-webkit-appearance:none}
.box{width:100%;background:var(--soft);border-radius:8px;padding:12px;font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mid);
  min-height:170px;white-space:pre;overflow:auto;border:1px solid var(--edge)}

#rest{position:fixed;left:14px;right:14px;bottom:18px;z-index:60;background:var(--ink);color:var(--bg);
  border-radius:12px;padding:13px 17px;display:none;align-items:center;justify-content:space-between;
  border:1px solid rgba(255,255,255,.12);max-width:592px;margin:0 auto}
#rest.on{display:flex} #rest.fim{background:var(--go)}
#rest .t{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#rest .l{font-size:12.5px;font-weight:600;opacity:.72}
#rest button{font-weight:700;font-size:14px;padding:9px 14px;background:rgba(255,255,255,.16);border-radius:8px}
#toast{position:fixed;left:14px;right:14px;bottom:18px;z-index:75;background:var(--ink);color:var(--bg);
  border-radius:12px;padding:13px 16px;font-size:15px;display:none;max-width:592px;margin:0 auto;font-weight:500;
  align-items:center;gap:12px}
#toast.on{display:flex} #toast.bad{background:var(--bad);color:#fff}
#toast span{flex:1}
#toast button{flex:0 0 auto;font-weight:700;font-size:15px;color:#FBD9B0;padding:4px 2px}
#rest.on ~ #toast{bottom:104px}
#ask{position:fixed;inset:0;z-index:90;background:rgba(20,24,32,.6);display:none;align-items:flex-end;justify-content:center;padding:16px}
#ask.on{display:flex}
#ask .b{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:460px}
#ask p{font-size:16px;margin:0 0 16px;white-space:pre-line}
#ask .r{display:flex;gap:10px}
#ask .r button{flex:1;padding:14px;border-radius:10px;font-size:16px;font-weight:700;border:1px solid var(--edge);color:var(--mid)}
#ask .r button.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ger{font-size:21px;color:var(--mid);line-height:1;padding:2px 4px;position:relative}
.ger.lembra::after{content:'';position:absolute;top:-1px;right:-2px;width:9px;height:9px;border-radius:50%;
  background:var(--sig);border:2px solid var(--bg)}
.lembrete{font-size:14.5px;margin:0 0 13px;padding:10px 12px;border-radius:8px;background:var(--sig-bg);color:var(--sig);font-weight:500}
.ok-bkp{font-size:14.5px;margin:0 0 13px;color:var(--mid)}
.socorro{background:var(--card);border:1px solid var(--bad);border-radius:12px;padding:16px;margin:16px 0}
.socorro h2{font-size:18px;margin:0 0 6px;color:var(--bad)}
.socorro p{font-size:14.5px;color:var(--mid);margin:0 0 12px}
#cfg{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;padding:0 16px 40px}
.cfgtop{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 12px;border-bottom:1px solid var(--edge);margin-bottom:14px}
.cfgtop b{font-size:20px;font-weight:700} .cfgtop button{font-size:16px;font-weight:600;color:var(--sig)}
#cfg .card{max-width:620px;margin-left:auto;margin-right:auto}
.linkadd{display:block;width:100%;padding:13px;margin-bottom:12px;border:1px dashed var(--edge);
  border-radius:10px;color:var(--mid);font-size:15px;font-weight:600}
.lnk{display:block;width:100%;padding:11px 0 2px;color:var(--mid);font-size:14px;font-weight:600;text-decoration:underline}
#cfg .box{min-height:120px}
</style>
</head>
<body>
<div id="warn" class="hide" style="background:#B91C1C;color:#fff;padding:11px 16px;font-size:14.5px"></div>
<header>
  <div class="top"><div class="crumb" id="crumb"></div>
    <div style="display:flex;align-items:center;gap:13px">
      <div class="sv" id="sv"><i></i><span>—</span></div>
      <button class="ger" id="ger" onclick="abreCfg()" aria-label="Ajustes e backup">⚙</button></div></div>
  <h1 id="dn"></h1><div class="focus" id="df"></div><div class="tag" id="tg"></div>
</header>
<div class="days" id="days"></div>
<main><div id="v1"></div></main>
<div id="cfg" class="hide"><div class="cfgtop"><b>Ajustes</b><button onclick="fechaCfg()">Fechar</button></div><div id="v2"></div></div>
<div id="rest"><div><div class="l" id="rl">Descanso</div><div class="t" id="rt">2:00</div></div>
  <div style="display:flex;gap:8px"><button onclick="mais(30)">+30s</button><button onclick="para()">Pular</button></div></div>
<div id="toast" role="status"><span id="tm"></span><button id="tb" class="hide"></button></div>
<div id="ask"><div class="b"><p id="am"></p><div class="r"><button id="an">Cancelar</button><button class="p" id="ay">Confirmar</button></div></div></div>


<script>
/* ================= PROGRAMA ================= */
let P=[
{n:"Upper A",f:"Peito e costas",ex:[
 {e:"Supino inclinado máquina",s:4,a:6,b:10,r:"1",d:150,m:"Peito",inc:2.5,note:"Escápula travada. Excêntrica 2-3s. Banco no 1º furo acima do reto, se ajustável."},
 {e:"Puxada neutra na polia",s:3,a:6,b:10,r:"1",d:150,m:"Costas",inc:2.5,note:"Puxe com o cotovelo, não com a mão. Sem encolher o ombro na orelha."},
 {e:"Supino reto máquina",s:3,a:8,b:12,r:"1",d:120,m:"Peito",inc:2.5},
 {e:"Remada hammer",s:3,a:8,b:12,r:"1",d:120,m:"Costas",inc:2.5,note:"Strap liberado: a pegada não deve limitar as costas."},
 {e:"Elevação lateral com halteres",s:5,a:12,b:20,r:"0-1",d:60,m:"Ombro lat",inc:2,iso:1},
 {e:"Crucifixo inverso",s:3,a:15,b:20,r:"0-1",d:60,m:"Ombro post",inc:1,iso:1},
 {e:"Tríceps francês ou testa",s:3,a:8,b:12,r:"0-1",d:75,m:"Tríceps",inc:2.5,iso:1,c:1},
 {e:"Rosca na polia baixa atrás do corpo",s:3,a:8,b:12,r:"0-1",d:75,m:"Bíceps",inc:2.5,iso:1,c:1}]},
{n:"Lower",f:"Pernas",ex:[
 {e:"Hack squat",s:3,a:6,b:10,r:"1-2",d:180,m:"Quadríceps",inc:5,note:"Descanso cheio. É o exercício mais importante do dia."},
 {e:"Terra romeno",s:3,a:6,b:10,r:"2",d:150,m:"Posterior",inc:5,note:"Quadril para trás, joelho quase fixo. Pare quando a lombar quiser ceder."},
 {e:"Mesa flexora deitada",s:3,a:10,b:15,r:"0-1",d:75,m:"Posterior",inc:2.5,iso:1},
 {e:"Cadeira extensora",s:3,a:12,b:15,r:"0-1",d:75,m:"Quadríceps",inc:2.5,iso:1,note:"Pausa de 1s no topo."},
 {e:"Panturrilha sentado",s:3,a:10,b:15,r:"0-1",d:60,m:"Panturrilha",inc:2.5,iso:1},
 {e:"Elevação lateral com halteres",s:3,a:12,b:20,r:"0-1",d:60,m:"Ombro lat",inc:2,iso:1},
 {e:"Voador",s:2,a:12,b:15,r:"0-1",d:75,m:"Peito",inc:2.5,iso:1,c:1},
 {e:"Abdominal com carga",s:3,a:10,b:15,r:"1",d:60,m:"Abdômen",inc:2.5,iso:1,c:1}]},
{n:"Upper B",f:"Peito e largura",ex:[
 {e:"Supino inclinado máquina/Smith",s:4,a:8,b:12,r:"1",d:150,m:"Peito",inc:2.5},
 {e:"Puxada máquina",s:4,a:8,b:12,r:"1",d:120,m:"Costas",inc:2.5},
 {e:"Remada máquina apoiada no peito",s:3,a:10,b:15,r:"1",d:120,m:"Costas",inc:2.5,note:"Strap liberado: a pegada não deve limitar as costas."},
 {e:"Voador",s:3,a:12,b:15,r:"0-1",d:90,m:"Peito",inc:2.5,iso:1,note:"Alongamento completo, pausa curta no fechamento."},
 {e:"Elevação lateral com halteres",s:5,a:12,b:20,r:"0-1",d:60,m:"Ombro lat",inc:2,iso:1},
 {e:"Crucifixo inverso máquina",s:3,a:15,b:20,r:"0-1",d:60,m:"Ombro post",inc:1,iso:1},
 {e:"Tríceps polia acima da cabeça",s:3,a:10,b:15,r:"0-1",d:75,m:"Tríceps",inc:2.5,iso:1,c:1},
 {e:"Rosca martelo na polia com corda",s:3,a:10,b:15,r:"0-1",d:75,m:"Bíceps",inc:2.5,iso:1,c:1,note:"Pegada neutra na corda, cotovelo parado ao lado do corpo. Trabalha bíceps, braquial e antebraço."}]}];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9]+/g,' ').trim();
// nome "histórico": ignora preposições, para "Elevação lateral halteres" = "Elevação lateral com halteres".
// Guardado em cache: é chamado milhares de vezes ao montar a tela.
const _nh=new Map();
const normH=s=>{s=String(s||'');let v=_nh.get(s);
  if(v===undefined){v=norm(s).replace(/\b(com|na|no|nas|nos|de|da|do|em|e|ou)\b/g,' ').replace(/\s+/g,' ').trim();
    if(_nh.size>4000)_nh.clear(); _nh.set(s,v);}
  return v;};
const SUBS={
"crucifixo polia baixa media":["Peck deck","Crossover na polia média","Crucifixo halteres em banco inclinado"],
"supino inclinado halteres 30":["Supino inclinado com barra 30°","Supino inclinado no Smith","Supino inclinado máquina"],
"supino reto barra ou halteres":["Supino reto máquina","Supino reto no Smith","Paralelas com carga"],
"elevacao lateral polia":["Elevação lateral com halteres","Elevação lateral máquina","Elevação lateral unilateral na polia"],
"triceps frances ou testa":["Tríceps polia acima da cabeça","Tríceps testa com halteres","Paralelas"],
"triceps corda":["Tríceps polia com barra","Tríceps máquina","Tríceps coice na polia"],
"barra fixa ou puxada neutra":["Puxada neutra na polia","Barra fixa assistida","Puxada supinada"],
"remada curvada barra":["Remada serrote com halter","Remada cavalinho","Remada máquina apoiada no peito"],
"pullover polia":["Pullover máquina","Pullover com halter","Puxada com braço estendido"],

function validaPrograma(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.dias)||!o.dias.length)return 'Faltam os dias de treino.';
  if(o.dias.length>7)return 'Um programa pode ter no máximo 7 sessões.';
  o.nome=limpaTxt(o.nome,60)||'Programa';
  o.prio=(Array.isArray(o.prio)?o.prio:[]).map(p=>limpaTxt(p,24)).filter(Boolean);
  for(const d of o.dias){
    if(!d||typeof d!=='object'||!Array.isArray(d.ex)||!d.ex.length)return 'Um dos dias está sem exercícios.';
    if(d.ex.length>15)return 'Uma sessão pode ter no máximo 15 exercícios.';
    d.n=limpaTxt(d.n,24); d.f=limpaTxt(d.f,40);
    if(!d.n)return 'Um dos dias está sem nome.';
    const vistos=new Set();
    for(const x of d.ex){
      if(!x||typeof x!=='object')return 'Exercício inválido em '+d.n+'.';
      x.e=limpaTxt(x.e,60); x.m=limpaTxt(x.m,24); x.r=limpaTxt(x.r,5)||'1';
      if(x.note!=null&&x.note!=='')x.note=limpaTxt(x.note,220); else delete x.note;
      if(Array.isArray(x.sub))x.sub=x.sub.map(v=>limpaTxt(v,60)).filter(Boolean); else delete x.sub;
      x.s=numOk(x.s,1,10); x.a=numOk(x.a,1,50); x.b=numOk(x.b,1,50);
      x.d=Number.isFinite(numOk(x.d,10,600))?+x.d:90;
      x.inc=Number.isFinite(numOk(x.inc,0,50))?+x.inc:2.5;
      if(x.iso)x.iso=1; else delete x.iso;
      if(x.bw)x.bw=1; else delete x.bw;
      if(Array.isArray(x.alias))x.alias=x.alias.map(v=>limpaTxt(v,60)).filter(Boolean); else delete x.alias;
      if(x.c)x.c=1; else delete x.c;
      if(x.par)x.par=1; else delete x.par;
      if(!x.e)return 'Um exercício está sem nome.';
      if(!x.m)return x.e+': falta o grupo muscular.';
      if(!Number.isFinite(x.s))return x.e+': séries devem ir de 1 a 10.';
      if(!Number.isFinite(x.a)||!Number.isFinite(x.b)||x.b<x.a)return x.e+': faixa de repetições inválida.';
      const nn=norm(x.e);
      if(vistos.has(nn))return 'Exercício repetido em '+d.n+': '+x.e;
      vistos.add(nn);}}
  return null;}

function normaliza(o){
  const T=Object.assign(novoEstado(),(o&&typeof o==='object'&&!Array.isArray(o))?o:{});
  ['logs','readiness','swaps','extras','flags','notas','uni'].forEach(k=>{if(!T[k]||typeof T[k]!=='object'||Array.isArray(T[k]))T[k]={};});
  if(!Array.isArray(T.body))T.body=[];
  T.body=T.body.filter(b=>b&&typeof b==='object');
  T.week=Math.max(1,Math.floor(+T.week)||1);
  if(T.inicio!=null){T.inicio=Math.floor(+T.inicio);if(!(T.inicio>=1))delete T.inicio;}
  T.dia=Math.max(0,Math.floor(+T.dia)||0);
  T.ultimo=+T.ultimo||0;
  if(!T.rest||typeof T.rest!=='object'||!(+T.rest.fim))T.rest=null;
  Object.keys(T.logs).forEach(k=>{const L=T.logs[k];
    if(!L||typeof L!=='object'||Array.isArray(L)){delete T.logs[k];return;}
    if(!L.sets||typeof L.sets!=='object'||Array.isArray(L.sets))L.sets={};
    Object.keys(L.sets).forEach(e=>{const a=L.sets[e];
      L.sets[e]=Array.isArray(a)?a.map(v=>v&&typeof v==='object'?v:{}):[];});});
  // exercícios avulsos: só campos conhecidos, números como números (vêm de backups e vão para a tela)
  Object.keys(T.extras).forEach(k=>{const arr=Array.isArray(T.extras[k])?T.extras[k]:[];
    const ent=(v,a,b,pad)=>{v=Math.round(+v);return v>=a&&v<=b?v:pad;};
    T.extras[k]=arr.filter(x=>x&&typeof x==='object'&&x.e).map(x=>{const a=ent(x.a,1,50,8),b=ent(x.b,1,50,12);
      return{e:limpaTxt(x.e,60)||'Exercício',s:ent(x.s,1,10,3),a:Math.min(a,b),b:Math.max(a,b),r:limpaTxt(x.r,5)||'0-1',
        d:ent(x.d,10,600,90),m:limpaTxt(x.m,24)||'Outro',inc:+x.inc>0&&+x.inc<=50?+x.inc:2.5,fixo:1,extra:1};});});
  T.progs=(Array.isArray(T.progs)?T.progs:[]).filter(x=>x&&+x.i>=1&&+x.nb>=2).map(x=>({i:Math.floor(+x.i),nb:Math.floor(+x.nb)}));
  if(!T.progs.length)delete T.progs;
  Object.keys(T.swaps).forEach(k=>{if(!T.swaps[k]||typeof T.swaps[k]!=='object')T.swaps[k]={};});
  {const n2={};Object.entries(T.notas).forEach(([k,v])=>n2[norm(k)]=v);T.notas=n2;}
  delete T.cfg;
  return T;}

const contaS=L=>Object.values((L&&L.sets)||{}).reduce((a,arr)=>a+(Array.isArray(arr)?arr.filter(val).length:0),0);

// Junta três versões: base (o que esta aba leu ou gravou por último), meu (esta aba) e deles (o que está gravado agora).
// O que esta aba mudou desde a base vence; todo o resto vem do que está gravado — inclusive o que a outra aba apagou.
function tresVias(base,meu,deles){const R=deles;
  ['week','dia','inicio','rest','ultimo','bkp','prog','progs'].forEach(x=>{
    if(!igual(meu[x],base[x])){if(meu[x]===undefined)delete R[x];else R[x]=meu[x];}});
  ['readiness','swaps','extras','notas','uni','flags'].forEach(m=>{
    new Set([...Object.keys(base[m]),...Object.keys(meu[m])]).forEach(k=>{
      if(!igual(meu[m][k],base[m][k])){if(meu[m][k]===undefined)delete R[m][k];else R[m][k]=meu[m][k];}});});
  // treinos: por sessão; se as duas abas mexeram na mesma sessão, por exercício
  new Set([...Object.keys(base.logs),...Object.keys(meu.logs)]).forEach(k=>{const b=base.logs[k],m=meu.logs[k],d=R.logs[k];
    if(igual(m,b))return;                       // esta aba não mexeu: fica o que está gravado
    if(m===undefined){delete R.logs[k];return;}  // esta aba apagou
    if(!d||igual(d,b)){R.logs[k]=m;return;}      // só esta aba mexeu
    const L=Object.assign({},d,{sets:Object.assign({},d.sets)});
    new Set([...Object.keys((b&&b.sets)||{}),...Object.keys(m.sets)]).forEach(e=>{const be=b&&b.sets?b.sets[e]:undefined,me=m.sets[e];
      if(!igual(me,be)){if(me===undefined)delete L.sets[e];else L.sets[e]=me;}});
    R.logs[k]=L;});
  // medidas: por data
  const porData=a=>{const o={};(a||[]).forEach(x=>{if(x&&x.date)o[x.date]=x;});return o;};
  const bb=porData(base.body),mb=porData(meu.body),db=porData(R.body);
  new Set([...Object.keys(bb),...Object.keys(mb)]).forEach(dt=>{if(!igual(mb[dt],bb[dt])){if(mb[dt]===undefined)delete db[dt];else db[dt]=mb[dt];}});
  R.body=Object.values(db).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return R;}
// Junta um backup O em D sem apagar nada de D: sessões que faltam entram; uma sessão com mais séries substitui
// a mesma sessão com menos. Treinos diferentes no mesmo lugar (datas diferentes) nunca se substituem.
function mescla(D,O){let novas=0,atualizadas=0,conflitos=0;
  Object.entries(O.logs||{}).forEach(([k,L])=>{
    if(!/^w\d+d\d+$/.test(k)||!L||!L.sets)return; const c=contaS(L); if(!c)return;
    const A=D.logs[k],ca=contaS(A);
    if(!A||!ca){D.logs[k]=L;novas++;return;}
    if(A.date&&L.date&&A.date!==L.date){conflitos++;return;}
    if(c>ca){D.logs[k]=L;atualizadas++;}});
  (O.body||[]).forEach(b=>{if(b&&b.date&&!D.body.some(x=>x.date===b.date))D.body.push(b);});
  D.body.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  Object.entries(O.readiness||{}).forEach(([k,v])=>{if(!D.readiness[k])D.readiness[k]=v;});
  Object.entries(O.swaps||{}).forEach(([k,v])=>{D.swaps[k]=Object.assign({},v,D.swaps[k]||{});});
  Object.entries(O.extras||{}).forEach(([k,arr])=>{D.extras[k]=D.extras[k]||[];
    (arr||[]).forEach(x=>{if(x&&x.e&&!D.extras[k].some(y=>norm(y.e)===norm(x.e)))D.extras[k].push(x);});});
  Object.entries(O.notas||{}).forEach(([k,v])=>{if(!D.notas[norm(k)])D.notas[norm(k)]=v;});
  Object.entries(O.uni||{}).forEach(([k,v])=>{if(v)D.uni[norm(k)]=1;});
  return{novas,atualizadas,conflitos};}

function periodoDe(w){ if(w>=ini())return{i:ini(),nb:NB,atual:1};

  if(p.legado){                                  // programa antigo: só importa saber o que foi deload
    if(s===7)return{t:'Deload',dl:1}; if(s===1)return{t:'Rampa',ramp:1}; if(s===2)return{t:'Rampa',ramp:2};
    return{t:'Volume cheio'};}

  if(s===1)return{t:'Rampa · isoladores com 1 série a menos',ramp:1};

function nS(x,w){const f=fase(w);
  if(x.fixo)return x.s;
  if(f.dl)return Math.max(1,Math.round(x.s*.5));

const key=(w,d)=>'w'+w+'d'+d;
const hojeLocal=()=>{const d=new Date();

const getLog=(w,d)=>S.logs[key(w,d)];
// cada sessão guarda o próprio nome; registros antigos usam o nome do programa da época
const LEGADO=['Push A','Pull A','Lower A','Push B','Pull B','Lower B'];
function nomeSessao(w,d){const L=getLog(w,d),p=periodoDe(w);
  if(L&&L.n)return L.n;

  return p.atual&&P[d]?P[d].n:'Sessão '+(d+1);}
function rotuloCiclo(w){const p=periodoDe(w);
  return p.legado?'PROGRAMA ANTERIOR · SEMANA '+w:(p.atual?'':'PROGRAMA ANTERIOR · ')+'BLOCO '+bloco(w)+' · CICLO '+sem(w);}
function mkLog(w,d){const k=key(w,d);
  if(!S.logs[k])S.logs[k]={sets:{},notes:'',rir:{},date:hojeLocal(),n:(P[d]?P[d].n:undefined)};
  if(!S.logs[k].rir)S.logs[k].rir={};

const cheio=v=>v!==''&&v!=null;
const val=s=>!!(s&&(cheio(s.reps)||cheio(s.repsD)));
const repsOf=s=>{const a=+s.reps||0,b=+s.repsD||0; return (a&&b)?Math.min(a,b):(a||b);};
const kgOf=s=>{const a=+s.kg||0,b=+s.kgD||0; return Math.max(a,b)||null;};
const ehUni=e=>!!S.uni[norm(e)];
const nome=(w,d,e)=>((S.swaps[key(w,d)]||{})[e])||e;
const extras=(w,d)=>S.extras[key(w,d)]||[];
const lista=(w,d)=>(P[d]?P[d].ex:[]).concat(extras(w,d));
const exDe=i=>lista(S.week,day)[i];
function alvoSemana(w){const A={};GRUPOS.forEach(m=>A[m]=0);
  P.forEach((p,d)=>p.ex.forEach(x=>A[x.m]=(A[x.m]||0)+nS(x,w)));return A;}
function apelidos(e){const def=P.flatMap(p=>p.ex).find(x=>x.e===e);
  return new Set([normH(e)].concat(def&&def.alias?def.alias.map(normH):[]));}
// O que foi (ou está sendo) feito no lugar de e na sessão (w,d): a troca, se houve; senão o próprio e.
function feito(w,d,e){const tr=S.swaps[key(w,d)]||{}; if(tr[e])return tr[e];
  const k=chave(w,d,e); return (k!==e&&tr[k])||e;}
// Nomes que contam como "o mesmo exercício" para referência e recorde: o nome do programa e os antigos,
// ou, se hoje houve troca, só o exercício que entrou no lugar.
function alvosDe(w,d,e){const f=feito(w,d,e); return f!==e?new Set([normH(f)]):apelidos(e);}
function anterior(dia,e){
  const alvos=alvosDe(S.week,dia,e);
  // 1º: a mesma sessão nos ciclos anteriores — desde que lá tenha sido feito este exercício, e não uma troca
  for(let w=S.week-1;w>=1;w--){ if(fase(w).dl)continue;
    const L=getLog(w,dia); if(!L||!L.sets)continue;
    const k=chave(w,dia,e),a=L.sets[k]; if(!Array.isArray(a)||!a.some(val))continue;
    const fez=(S.swaps[key(w,dia)]||{})[k]||k;
    if(alvos.has(normH(fez)))return{w,d:dia,arr:a,de:fez};}
  // 2º: o mesmo exercício em outra sessão ou no programa anterior (o registro mais recente)
  let melhor=null;
  for(const [k,L] of Object.entries(S.logs)){const m=k.match(/^w(\d+)d(\d+)$/); if(!m||!L||!L.sets)continue;
    const w=+m[1],dd=+m[2]; if(w>=S.week||fase(w).dl)continue;
    const tr=S.swaps[k]||{};
    for(const [nm,a] of Object.entries(L.sets)){
      const fez=tr[nm]||nm;                 // se houve troca, vale o que foi feito
      if(!Array.isArray(a)||!alvos.has(normH(fez))||!a.some(val))continue;
      if(!melhor||w>melhor.w||(w===melhor.w&&dd===dia&&melhor.d!==dia))melhor={w,d:dd,arr:a,outro:dd!==dia?1:0,de:fez};}}
  return melhor;}
// Melhor série do exercício no programa atual, em qualquer sessão (nomes antigos e trocas incluídos).
// pula = {k,nm,i}: a série que acabou de ser digitada, para comparar com o que existia antes dela.
function recorde(alvos,pula){let b=null;
  for(const [k,L] of Object.entries(S.logs)){ if(!L||!L.sets)continue;
    const g=k.match(/^w(\d+)d/); if(!g||+g[1]<ini())continue;
    const tr=S.swaps[k]||{};
    for(const [nm,a] of Object.entries(L.sets)){
      if(!Array.isArray(a)||!alvos.has(normH(tr[nm]||nm)))continue;
      for(let i=0;i<a.length;i++){ const sv=a[i];
        if(pula&&k===pula.k&&nm===pula.nm&&i===pula.i)continue;
        if(!val(sv))continue; const kg=kgOf(sv),rr=repsOf(sv); if(!kg||!rr)continue;
        if(!b||kg>b.kg||(kg===b.kg&&rr>b.reps))b={kg,reps:rr};}}}
  return b;}
// "no ciclo 3", "no ciclo 9 do bloco 1", "no programa anterior"
const quando=w=>w<ini()?'no programa anterior':'no ciclo '+sem(w)+(bloco(w)!==bloco(S.week)?' do bloco '+bloco(w):'');
function prog(x,prev,alvo){if(!prev)return null;
  const v=prev.arr.filter(val);
  const ck=v.map(kgOf).filter(Boolean), kg=ck.length?Math.max(...ck):null;
  const abaixo=v.filter(s=>repsOf(s)<x.a).length;
  if(kg!=null && v.length>=2 && abaixo*2>=v.length){
    const passo=x.inc||2.5; let alvoKg=Math.floor(kg*0.9/passo)*passo;
    if(alvoKg>=kg)alvoKg=kg-passo;
    if(alvoKg>0 && (kg-alvoKg)/kg<=0.2) return{down:1,kg,novo:+alvoKg.toFixed(1),abaixo};
    return{up:0,kg,baixo:1,abaixo};}      // degrau grande demais: mantém e busca a faixa
  if(v.length<alvo)return null;
  const largo=(x.b-x.a)>=6;   // faixa ampla: a 1ª série manda, as demais só precisam ficar na faixa
  const bateu = largo ? (repsOf(v[0])>=x.b && v.every(s=>repsOf(s)>=x.a))
                      : v.every(s=>repsOf(s)>=x.b);
  if(bateu)return kg!=null?{up:1,kg:+(kg+(x.inc||2.5)).toFixed(1),largo}:{up:1,bw:1,largo};
  const falta = largo ? (repsOf(v[0])<x.b?1:v.filter(s=>repsOf(s)<x.a).length)
                      : v.filter(s=>repsOf(s)<x.b).length;
  return{up:0,kg,falta,largo};}

let rT=null,tAuto=null;
// O canal de áudio só existe durante o bipe (~1s). Antes ele ficava aberto o treino inteiro,
// disputando a saída de som com o app de música.
function bipe(){ const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  let AC; try{ AC=new C(); if(AC.state==='suspended')AC.resume(); }catch(e){return;}
  setTimeout(()=>{try{AC.close();}catch(e){}},1500);
  try{ const t0=AC.currentTime;
    [0,0.26,0.52].forEach((t,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine'; o.frequency.value=i===2?1175:880;
      g.gain.setValueAtTime(0.0001,t0+t);
      g.gain.exponentialRampToValueAtTime(0.45,t0+t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+t+0.22);
      o.connect(g);g.connect(AC.destination);
      o.start(t0+t);o.stop(t0+t+0.25);});
  }catch(e){} }
let rFim=0,rLbl='',avisou=0,wl=null,wlPend=false,wlQuer=false;
async function travaTela(on){ wlQuer=on; try{
  if(on){ if(!('wakeLock' in navigator)||wl||wlPend||document.hidden)return;
    wlPend=true; const w=await navigator.wakeLock.request('screen'); wlPend=false;
    if(!wlQuer){try{await w.release();}catch(e){} return;}      // o descanso acabou enquanto o pedido estava pendente
    wl=w; w.addEventListener('release',()=>{if(wl===w)wl=null;}); }
  else if(wl){ const w=wl; wl=null; await w.release(); } }catch(e){wlPend=false;} }
// Esconde a barra do descanso e para o relógio, sem mexer no que está gravado.
function escondeTimer(){clearInterval(rT);clearTimeout(tAuto);rT=null;tAuto=null;rFim=0;
  const el=document.getElementById('rest');if(el)el.classList.remove('on','fim');
  travaTela(false);}
function desc(sec,lbl){ clearTimeout(tAuto); tAuto=null;

function rodaTimer(){

let ultimoTxt='';
function pinta(){
  const el=document.getElementById('rest'); if(!el)return;

  const txt=Math.floor(seg/60)+':'+String(seg%60).padStart(2,'0');
  if(txt!==ultimoTxt){ultimoTxt=txt;document.getElementById('rt').textContent=txt;}

function mais(n){ clearTimeout(tAuto); tAuto=null; rFim+=n*1000; avisou=0; S.rest={fim:rFim,lbl:rLbl}; save();

// semGravar: usado ao adotar o que outra aba gravou (não gera uma gravação de volta).
function retomaTimer(semGravar){

// "120×7", "7" (sem carga), "20×12/10" (esquerdo/direito, registros antigos)
function fmtSerie(s){ if(!s)return '';

    const kg=k1!==''&&k2!==''&&String(k1)!==String(k2)?k1+'/'+k2:(k1!==''?k1:k2);

function treino(){

    // carga em cinza no campo: a da série anterior de hoje; senão, a da referência. Se só as reps forem digitadas, vale ela.
    const refKg=k=>{ if(!prev)return ''; const o=prev.arr[k]; if(o&&cheio(o.kg))return String(o.kg);

        h+=`<tr class="${ok?'ok':''}${tem?' tem':''}" id="r${i}_${k}${lb}">
        <td class="sn">${k+1}${lb?`<i>${lb}</i>`:''}</td>
        <td class="pv">${cheio(oRp)?(cheio(oKg)?`<b>${esc(oKg)}</b>kg×<b>${esc(oRp)}</b>`:`<b>${esc(oRp)}</b> reps`):'—'}</td>
        <td class="in"><input type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" aria-label="Série ${k+1}${lb?' '+lb:''}, carga em kg" placeholder="${ph?esc(ph):'kg'}" data-ph="${esc(ref)}" value="${esc(c['kg'+sf])}" onfocus="selTudo(this)" oninput="põe(${i},${k},'kg${sf}',this)"></td>
        <td class="in"><input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next" aria-label="Série ${k+1}${lb?' '+lb:''}, repetições" placeholder="${x.a}-${x.b}" value="${esc(c['reps'+sf])}" onfocus="selTudo(this)" oninput="põe(${i},${k},'reps${sf}',this)" onchange="fim(${i},${k})"></td>
        <td class="xx"><button onclick="limpa(${i},${k},'${sf}')" aria-label="Apagar série ${k+1}">×</button></td></tr>`;});
      if(!uni&&cheio(c.kg))hoje=String(c.kg);}
    h+=`</table><div class="foot"><button class="add" onclick="maisSerie(${i})">+ série</button></div></div>`;});

  h+=`<button class="linkadd" onclick="abreAdd()">+ adicionar exercício</button>
    <div class="card hide" id="addbox">

  orfaos(S.week,day).forEach(o=>{

      <span>${esc(o.arr.map(fmtSerie).join(' · '))} · registrado, fora do programa atual</span></div></div></div>`;});
  h+=`<div class="card" id="cfh"><h2>Como foi hoje</h2>
    <p>Dois marcadores em "ruim" por dois ciclos seguidos: corte uma série por grupo.</p>`;

      <button class="${v==1?'on bad':''}" onclick="rd('${k}',1)">ruim</button></div>`;});
  h+=`</div>`;
  h+=blocoVolume();

function blocoVolume(){
  const AL=alvoSemana(S.week),feito={};
  P.forEach((p,d)=>{const L=getLog(S.week,d);if(!L)return;
    lista(S.week,d).forEach(x=>{feito[x.m]=(feito[x.m]||0)+(L.sets[chave(S.week,d,x.e)]||[]).filter(val).length;});});
  let h=`<div class="card"><h2>Séries deste ciclo</h2>`;
  Object.entries(AL).sort((a,b)=>b[1]-a[1]).forEach(([m,t])=>{const c=feito[m]||0,acima=c>t;
    h+=`<div class="vr"><div class="vn">${esc(m)}</div><div class="vb">
      <div class="vf ${acima?'over':(c>=t?'full':'')}" style="width:${t?Math.min(100,c/t*100):0}%"></div></div>
      <div class="vv ${acima?'over':''}"><b>${c}</b>/${t}</div></div>`;});
  const ex=Object.entries(AL).filter(([m,t])=>(feito[m]||0)>t);
  if(ex.length)h+=`<div class="alert i" style="margin:13px 0 0"><b>Acima do planejado:</b> ${ex.map(([m,t])=>esc(m)+' '+feito[m]+' de '+t).join(', ')}.</div>`;
  // sessões com dois marcadores em "ruim", no ciclo atual e no anterior (dois ciclos seguidos)
  const ruins=w=>P.map((p,d)=>({p,r:S.readiness[key(w,d)]})).filter(o=>o.r&&Object.values(o.r).filter(v=>v===1).length>=2).map(o=>esc(o.p.n)+' (ciclo '+sem(w)+')');
  const fa=ruins(S.week),fb=S.week>1?ruins(S.week-1):[],fl=fb.concat(fa);
  if(fa.length&&fb.length)h+=`<div class="alert" style="margin:13px 0 0"><b>Sinal de excesso de volume.</b> ${fl.join(', ')}. Corte uma série por grupo.</div>`;
  h+=`<div style="height:13px"></div>
    <div class="frow"><button class="btn g" onclick="voltaSemana()">Voltar ciclo</button>
    <button class="btn g" onclick="proxSemana()">Avançar ciclo</button></div></div>`;
  return h;}

// Encontra onde as séries deste exercício estão gravadas nesta sessão.
// Se o exercício foi renomeado depois do registro, usa o nome antigo (ou o que foi feito via troca).
function chave(w,d,e){const L=getLog(w,d); if(!L||!L.sets||L.sets[e])return e;
  const doProg=new Set(lista(w,d).map(x=>x.e)), tr=S.swaps[key(w,d)]||{}, alvos=apelidos(e);
  for(const k of Object.keys(L.sets)){ if(doProg.has(k))continue;
    if(alvos.has(normH(tr[k]||k))||alvos.has(normH(k)))return k; }
  return e;}
// Séries desta sessão que não pertencem a nenhum exercício do programa atual (ex.: exercício removido).
function orfaos(w,d){const L=getLog(w,d); if(!L||!L.sets)return [];
  const usados=new Set(lista(w,d).map(x=>chave(w,d,x.e))), tr=S.swaps[key(w,d)]||{};
  return Object.entries(L.sets).filter(([k,a])=>!usados.has(k)&&Array.isArray(a)&&a.some(val)).map(([k,a])=>({nome:tr[k]||k,arr:a.filter(val)}));}
function cel(i,k){const ck=chave(S.week,day,exDe(i).e),L=mkLog(S.week,day);
  if(!L.sets[ck])L.sets[ck]=[];
  while(L.sets[ck].length<=k)L.sets[ck].push({});
  return L.sets[ck][k];}
function leCel(i,k){const ck=chave(S.week,day,exDe(i).e),L=getLog(S.week,day);          // leitura não cria estado
  return (L&&L.sets[ck]&&L.sets[ck][k])||null;}
// Tocar num campo já preenchido seleciona o número: digitar substitui em vez de emendar.
function selTudo(el){if(el.value)setTimeout(()=>{try{el.select();}catch(e){}},0);}
const novas=new Set();   // séries que acabaram de ser preenchidas: só elas disparam o descanso (corrigir uma antiga não)
// Aceita vírgula ou ponto na carga; só números nas repetições.
function limpaNum(v,dec){v=String(v==null?'':v).trim();
  if(!dec)return v.replace(/\D/g,'').slice(0,3);
  v=v.replace(/,/g,'.').replace(/[^0-9.]/g,''); const p=v.indexOf('.');
  if(p>=0)v=v.slice(0,p+1)+v.slice(p+1).replace(/\./g,'');
  return v.slice(0,6);}
function põe(i,k,f,el){
  const v=limpaNum(el&&typeof el==='object'?el.value:el,/^kg/.test(f));
  const antes=feitoDia(S.week,day);
  const s=cel(i,k),era=val(s); s[f]=v; S.ultimo=Date.now(); S.dia=day;
  const id=i+'_'+k;
  if(!era&&val(s))novas.add(id); else if(!val(s))novas.delete(id);
  const sf=/D$/.test(f)?'D':'', lb=ehUni(exDe(i).e)?(sf||'E'):'';
  const r=document.getElementById('r'+i+'_'+k+lb);
  if(r){r.classList.toggle('ok',cheio(s['reps'+sf]));r.classList.toggle('tem',cheio(s['reps'+sf])||cheio(s['kg'+sf]));}
  if(f==='kg'&&!lb)atualizaDicas(i);
  save(); if(feitoDia(S.week,day)!==antes)abas();}
// Atualiza a carga em cinza das séries ainda vazias: a última digitada hoje; senão, a da referência.
function atualizaDicas(i){
  const L=getLog(S.week,day),arr=(L&&L.sets[chave(S.week,day,exDe(i).e)])||[];
  let ult='';
  for(let j=0;;j++){const r=document.getElementById('r'+i+'_'+j); if(!r)break;
    const inp=r.querySelector('td.in input'),c=arr[j];
    if(inp&&!cheio(c&&c.kg))inp.placeholder=ult||inp.dataset.ph||'kg';
    if(c&&cheio(c.kg))ult=String(c.kg);}}
// Séries que o exercício pede hoje: as do programa, ou mais se o usuário acrescentou linhas ("+ série").
function alvoEx(x,arr){return aberto.has(x.e)?Math.max(nS(x,S.week),arr.length):nS(x,S.week);}
function sessaoCompleta(){const L=getLog(S.week,day); if(!L)return false;
  return lista(S.week,day).every(x=>{const a=L.sets[chave(S.week,day,x.e)]||[];return a.filter(val).length>=alvoEx(x,a);});}
// Espera o foco chegar ao próximo campo antes de concluir a série (ver o preenchimento da carga abaixo).
function fim(i,k){setTimeout(()=>fimAgora(i,k),0);}
function fimAgora(i,k){const s=leCel(i,k); if(!val(s))return;
  const x=exDe(i),ck=chave(S.week,day,x.e),id=i+'_'+k,nova=novas.has(id); novas.delete(id);
  // Só digitou as reps: vale a carga que aparecia em cinza (a da série anterior de hoje ou a da referência).
  // Se o toque foi justamente no campo de carga desta série, não preenche: ele vai digitar.
  if(nova&&!ehUni(x.e)&&!cheio(s.kg)){
    const r=document.getElementById('r'+i+'_'+k),inp=r&&r.querySelector('td.in input'),ph=inp?inp.placeholder:'';
    if(inp&&document.activeElement!==inp&&/^\d+(\.\d+)?$/.test(ph)){s.kg=ph;inp.value=ph;r.classList.add('tem');atualizaDicas(i);}}
  const kk=kgOf(s),rr=repsOf(s),rec=recorde(alvosDe(S.week,day,x.e),{k:key(S.week,day),nm:ck,i:k});
  if(rec&&kk&&rr&&(kk>rec.kg||(kk===rec.kg&&rr>rec.reps))){
    toast('Novo recorde: '+kk+'kg × '+rr+' em '+nome(S.week,day,x.e)+'.');
    if(navigator.vibrate)navigator.vibrate(60);}
  save();
  const L=getLog(S.week,day),arr=(L&&L.sets[ck])||[],feitas=arr.filter(val).length;
  const terminou=feitas>=nS(x,S.week)&&!aberto.has(x.e);           // recolhe o exercício
  const acabou=feitas>=alvoEx(x,arr)&&sessaoCompleta();             // última série do dia: sem descanso
  if(nova){ if(acabou){ if(rFim)para(); toast('Sessão completa. Marque abaixo como foi o treino.'); }
            else tDe(i); }
  if(terminou)requestAnimationFrame(()=>{treino();setTimeout(()=>vaiParaProximo(i,acabou),60);});   // só redesenha quando o exercício termina
  flush();}
// Depois de concluir um exercício, leva a tela até o próximo que falta (ou ao fim da sessão).
function vaiParaProximo(i,acabou){ let alvo=null;
  if(!acabou){const n=lista(S.week,day).length;
    for(let d=1;d<=n;d++){const el=document.getElementById('ex'+((i+d)%n)); if(el&&!el.classList.contains('col')){alvo=el;break;}}}
  if(!alvo)alvo=document.getElementById('cfh');
  if(!alvo)return;
  const hh=(document.querySelector('header')||{}).offsetHeight||0;
  window.scrollTo({top:Math.max(0,alvo.getBoundingClientRect().top+window.scrollY-hh-10),behavior:'smooth'});}
function limpa(i,k,sf){const x0=exDe(i),ck=chave(S.week,day,x0.e),L=getLog(S.week,day),w=S.week,d=day;
  const c=L&&L.sets[ck]&&L.sets[ck][k]; if(!c||(!cheio(c.kg)&&!cheio(c.reps)&&!cheio(c.kgD)&&!cheio(c.repsD)))return;
  const antes=JSON.parse(JSON.stringify(c));
  if(!ehUni(x0.e)){L.sets[ck][k]={};}
  else{delete c['kg'+sf];delete c['reps'+sf];}
  novas.delete(i+'_'+k); save(); render();
  toast('Série '+(k+1)+' apagada.',0,{txt:'Desfazer',fn:()=>{
    const L2=S.logs[key(w,d)]; if(!L2)return; L2.sets[ck]=L2.sets[ck]||[];
    while(L2.sets[ck].length<=k)L2.sets[ck].push({});
    L2.sets[ck][k]=antes; save(); render(); toast('Série '+(k+1)+' de volta.');}});}
function maisSerie(i){const x=exDe(i),L=mkLog(S.week,day),ck=chave(S.week,day,x.e);
  if(!L.sets[ck])L.sets[ck]=[];
  while(L.sets[ck].length<nS(x,S.week))L.sets[ck].push({});      // as linhas que já aparecem na tela
  L.sets[ck].push({}); aberto.add(x.e); save(); treino();}
function reabre(i){aberto.add(exDe(i).e);treino();}
function recolhe(i){aberto.delete(exDe(i).e);treino();}
// Abre as substituições sem focar o campo de texto: o teclado cobriria as sugestões.

function salvaT(i){const x=exDe(i),k=key(S.week,day),v=limpaTxt(document.getElementById('swi'+i).value,60);

function abreAdd(){const e=document.getElementById('addbox');

function rd(k,v){const id=key(S.week,day);mkLog(S.week,day);

/* ================= AJUSTES ================= */
const nSess=T=>Object.values((T&&T.logs)||{}).filter(L=>contaS(L)>0).length;
const dataBR=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');};
const diasDesde=t=>Math.floor((Date.now()-t)/864e5);
// Backup "atrasado": 3+ sessões e nenhum backup, ou o último tem 10+ dias e houve treino depois dele.
function backupAtrasado(){ if(nSess(S)<3)return false; if(!S.bkp)return true;
  if(diasDesde(S.bkp)<10)return false;
  return Object.values(S.logs).some(L=>contaS(L)>0&&L.date&&new Date(L.date+'T23:59:59').getTime()>S.bkp);}
function lembraBackup(){const g=document.getElementById('ger'); if(g)g.classList.toggle('lembra',backupAtrasado());}
// Cópia automática feita na 1ª abertura de cada dia. Só aparece nos Ajustes se tiver treinos que não estão aqui.
function copiaUtil(){try{const c=JSON.parse(localStorage.getItem(KCOP)||'null'); if(!c||!c.v)return null;
  const o=normaliza(JSON.parse(c.v)); let n=0;
  Object.entries(o.logs).forEach(([k,L])=>{const q=contaS(L); if(q&&q>contaS(S.logs[k]))n++;});
  return n?{d:c.d,n,o}:null;}catch(e){return null;}}
function copiaDoDia(raw){try{const hj=hojeLocal(),c=JSON.parse(localStorage.getItem(KCOP)||'null');
  if(c&&c.d===hj)return;
  if(c&&c.v&&nSess(normaliza(JSON.parse(raw)))<nSess(normaliza(JSON.parse(c.v))))return;  // nunca troca por uma versão com menos treinos
  localStorage.setItem(KCOP,JSON.stringify({d:hj,v:raw}));}catch(e){}}
function ajustes(){
  const last=S.body[S.body.length-1]||{},first=S.body[0],ns=nSess(S);
  let h=`<div class="card"><h2>Backup</h2>`;
  if(S.bkp){const dd=diasDesde(S.bkp);
    h+=backupAtrasado()?`<p class="lembrete">Último backup em ${dataBR(S.bkp)}, há ${dd} dias. Baixe um novo: é ele que recupera os treinos se o celular for trocado ou o navegador for limpo.</p>`
                       :`<p class="ok-bkp">Último backup: ${dataBR(S.bkp)}${dd===0?' (hoje)':dd===1?' (ontem)':' (há '+dd+' dias)'}.</p>`;}
  else if(ns)h+=`<p class="lembrete">Nenhum backup baixado ainda. Os treinos ficam salvos neste aparelho, mas se o celular for trocado, formatado ou o navegador for limpo, só o arquivo de backup traz tudo de volta.</p>`;
  else h+=`<p>Os treinos ficam salvos neste aparelho e sobrevivem às atualizações do app. O backup serve para trocar de celular ou para um imprevisto.</p>`;
  h+=`<div class="frow"><button class="btn${backupAtrasado()?'':' g'}" onclick="baixaBackup()">Baixar backup</button>
      <button class="btn g" onclick="document.getElementById('arq').click()">Abrir arquivo</button></div>
    <input type="file" id="arq" accept=".json,.txt,application/json,text/plain" class="hide" onchange="leArquivo(this)">
    <button class="lnk" onclick="revela('cxBkp')">ou copiar e colar como texto</button>
    <div class="hide" id="cxBkp">
      <textarea class="box" id="out" placeholder="Cole aqui um backup e toque em Restaurar."></textarea>
      <div class="frow" style="margin-top:9px">
        <button class="btn g" onclick="mostra('resumo')">Resumo</button>
        <button class="btn g" onclick="copia()">Copiar</button>
        <button class="btn g" onclick="restaura()">Restaurar</button></div></div>`;
  const cp=copiaUtil();
  if(cp)h+=`<button class="lnk" onclick="recuperaCopia()">recuperar a cópia automática de ${esc(cp.d.split('-').reverse().slice(0,2).join('/'))} (${cp.n} ${cp.n>1?'sessões que não estão':'sessão que não está'} aqui)</button>`;
  h+=`</div>`;

  let estragado=null;try{estragado=localStorage.getItem(KEST);}catch(e){}
  if(estragado)h+=`<div class="card"><h2>Dados danificados</h2><p>Ao abrir, os dados salvos estavam ilegíveis. Guardei uma cópia deles: copie e me mande para recuperar o que der.</p>
    <div class="frow"><button class="btn g" onclick="copiaTexto(localStorage.getItem(KEST)||'')">Copiar</button>

function reposiciona(T){

    save();}
  // sessões do programa atual sem nome (versões antigas) recebem o nome: continuam certas se o programa mudar
  Object.entries(S.logs).forEach(([k,L])=>{const g=k.match(/^w(\d+)d(\d+)$/);
    if(g&&+g[1]>=ini()&&!L.n&&P[+g[2]]&&contaS(L)>0){L.n=P[+g[2]].n;pend=true;}});
  const noMeio=S.ultimo&&(Date.now()-S.ultimo<3*3600000);
  if(!noMeio&&!aviso&&proxima()===-1){ S.week++; S.dia=0; save();
    aviso='Ciclo anterior completo. Começando o ciclo '+sem(S.week)+(fase(S.week).dl?' — deload.':'.');}
  day=Math.min(Math.max(0,+S.dia||0),P.length-1);
  // reabre na sessão em andamento; se ela já terminou (ou passou o tempo), na próxima da fila
  const emAndamento=noMeio&&!sessaoCompleta();
  if(!emAndamento){const nx=proxima(); if(nx>=0)day=nx;}
  if(S.dia!==day){S.dia=day;save();}
  render(); retomaTimer(); if(emAndamento)voltaRolagem(); await flush(); lembraBackup();
  if(estragado)toast('Os dados salvos estavam ilegíveis. Guardei uma cópia deles em ⚙.',1);
  else if(aviso)toast(aviso);
  const doLink=leLinkDaURL(); limpaHash();
  if(doLink&&JSON.stringify(doLink)!==JSON.stringify(S.prog||null))
    ask('Aplicar o programa "'+(doLink.nome||'sem nome')+'"?\n\n'+doLink.dias.length+' sessões. Ele começa no ciclo 1 de um bloco novo; seu histórico não é apagado.',
      ()=>iniciaPrograma(doLink),null,'Aplicar');
  pedePersistencia();
 }catch(e){anotaErro('início: '+(e&&e.message)); socorro(e);}
})();
</script>
